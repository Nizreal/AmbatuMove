worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 128k;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;

    limit_req_zone $server_name zone=global_limit:1m rate=30r/s;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    server {
        listen 8080;
        server_name _;

        location @rate_limited {
            default_type application/json;
            add_header Retry-After "1" always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Request rate limit exceeded."},"meta":{"request_id":"$request_id"}}';
        }

        location / {
            limit_req zone=global_limit burst=60 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            # Replace any client-supplied XFF. Cloudflare overwrites CF-Connecting-IP;
            # the Go service accepts XFF only from this explicitly trusted gateway.
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://core-service:8080;
        }
    }
}
