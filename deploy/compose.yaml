name: ambatumove

services:
  core-service:
    image: ${AMBATUMOVE_IMAGE:?Set AMBATUMOVE_IMAGE}
    platform: linux/arm64
    restart: unless-stopped
    init: true
    env_file: ["${AMBATUMOVE_CONFIG_FILE:-.env}"]
    environment:
      APP_ENV: production
      SEED_SYNTHETIC_GYMS: "false"
      HTTP_ADDR: ":8080"
      DATABASE_PATH: /data/ambatumove.sqlite
      TRUSTED_PROXY_CIDRS: 172.29.240.10/32
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-512}
      AI_RATE_LIMIT_RPM: ${AI_RATE_LIMIT_RPM:-5}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-1}
      GOMEMLIMIT: 256MiB
      GOMAXPROCS: "1"
    volumes:
      - ${DATA_HOST_DIR:?Set DATA_HOST_DIR}:/data
    expose: ["8080"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 384m
    cpus: 0.75
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    networks: [appnet]

  gateway:
    image: nginx:1.28-alpine
    platform: linux/arm64
    user: "101:101"
    restart: unless-stopped
    depends_on:
      core-service: {condition: service_healthy}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18080}:8080"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777", "/var/cache/nginx:size=8m,mode=1777", "/var/run:size=1m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 32
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    networks:
      appnet:
        ipv4_address: 172.29.240.10

networks:
  appnet:
    ipam:
      config: [{subnet: 172.29.240.0/24}]
